<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10172d" />
    <meta
      name="description"
      content="Рассчитай ежемесячный взнос по сумме цели, накоплениям и сроку."
    />
    <title>mathical — финансовый симулятор</title>
    <link rel="stylesheet" href="css/site.css" />
  </head>
  <body class="home-page">
    <main class="worksheet">
      <h1>Сколько откладывать<br />в месяц?</h1>
      <p class="worksheet-intro">
        Например, велосипед за 36 000 ₽. В копилке уже 12 000 ₽, а до покупки полгода.
      </p>
      <form id="quick-goal">
        <div class="worksheet-fields">
          <label
            >Сумма цели, ₽<input
              name="target"
              type="number"
              inputmode="numeric"
              min="1"
              max="1000000000"
              step="1"
              value="36000"
              required
          /></label>
          <label
            >Уже отложено, ₽<input
              name="saved"
              type="number"
              inputmode="numeric"
              min="0"
              max="1000000000"
              step="1"
              value="12000"
              required
          /></label>
          <label
            >Срок в месяцах<input
              name="months"
              type="number"
              inputmode="numeric"
              min="1"
              max="600"
              step="1"
              value="6"
              required
          /></label>
        </div>
        <div class="worksheet-total">
          <div>
            <span>Ежемесячный взнос</span
            ><output id="contribution" aria-live="polite"></output>
          </div>
          <p id="calculation"></p>
        </div>
        <p class="worksheet-note">
          Взносы равные, без процентов и роста цен. Округляем до рубля вверх.
        </p>
      </form>
      <nav class="worksheet-links" aria-label="Финансовый план">
        <a class="btn btn-primary" href="plan.html"
          >Открыть мой бюджет <span aria-hidden="true">→</span></a
        >
        <a href="results.html">Результаты моего плана</a>
      </nav>
    </main>

    <script type="module" src="js/home.js"></script>
  </body>
</html>
